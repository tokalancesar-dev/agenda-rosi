<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agenda Rosi Gomes - Sincronizada</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
    :root {
        --cor-primaria: #7c3aed;
        --cor-primaria-escura: #5b21b6;
        --cor-secundaria: #ec4899;
        --cor-fundo: #faf7ff;
        --cor-card: #fdfbff;
        --cor-texto: #374151;
        --cor-borda: #e9d5ff;
    }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(180deg, var(--cor-fundo) 0%, #f3e8ff 100%);
        margin: 0;
        padding: 20px;
        color: var(--cor-texto);
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background: var(--cor-card);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 8px 24px rgba(124, 58, 237, 0.10);
        border: 1px solid var(--cor-borda);
    }
    .header {
        text-align: center;
        margin-bottom: 32px;
        position: relative;
        padding: 24px 16px;
        background: linear-gradient(135deg, #f5f3ff, #fdf4ff);
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.15), inset 0 1px 0 rgba(255,255,255,0.6);
        overflow: hidden;
    }
    h1 {
        font-size: 1.8rem;
        margin: 0;
        color: var(--cor-primaria-escura);
        line-height: 1.2;
        font-weight: 800;
        text-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
        background: linear-gradient(90deg, var(--cor-primaria), var(--cor-secundaria), var(--cor-primaria));
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 4s linear infinite;
    }
    .subtitulo {
        font-size: 1rem;
        color: var(--cor-primaria-escura);
        font-weight: 600;
        margin-top: 6px;
        letter-spacing: 0.6px;
        text-shadow: 0 1px 4px rgba(124, 58, 237, 0.15);
    }
    .estrelas {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    .estrela {
        position: absolute;
        width: 7px;
        height: 7px;
        background: var(--cor-secundaria);
        border-radius: 50%;
        opacity: 0;
        box-shadow: 0 0 8px var(--cor-secundaria), 0 0 12px rgba(236, 72, 153, 0.4);
        animation: twinkle 3s ease-in-out infinite;
    }
    .estrela:nth-child(1) { top: 12%; left: 18%; animation-delay: 0s; }
    .estrela:nth-child(2) { top: 25%; left: 85%; animation-delay: 0.9s; }
    .estrela:nth-child(3) { top: 75%; left: 12%; animation-delay: 1.8s; }
    .estrela:nth-child(4) { top: 65%; left: 88%; animation-delay: 0.5s; }
    .estrela:nth-child(5) { top: 18%; left: 52%; animation-delay: 1.3s; }
    .estrela:nth-child(6) { top: 45%; left: 75%; animation-delay: 2.2s; }
    @keyframes shimmer {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
    }
    .relatorio {
        background: #faf5ff;
        border: 1px solid var(--cor-borda);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 20px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        text-align: center;
        min-height: 90px;
    }
    .relatorio-item { padding: 8px; }
    .relatorio-num {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--cor-primaria);
    }
    .relatorio-label {
        font-size: 0.75rem;
        color: var(--cor-texto);
        margin-top: 2px;
    }
    .relatorio-receita {
        grid-column: 1 / -1;
        background: linear-gradient(135deg, #f5d0fe, #e9d5ff);
        border-radius: 10px;
        padding: 16px;
        min-height: 60px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .relatorio-receita:hover {
        background: linear-gradient(135deg, #e9d5ff, #ddd6fe);
        transform: translateY(-2px);
    }
    .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--cor-borda);
    }
    .tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        font-weight: 600;
        font-size: 0.9rem;
        color: #6b7280;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
        transition: all 0.2s;
    }
    .tab.active {
        color: var(--cor-primaria);
        border-bottom-color: var(--cor-primaria);
    }
    .total-dia {
        text-align: center;
        font-size: 0.8rem;
        color: #6b7280;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px dashed var(--cor-borda);
    }
    label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--cor-primaria-escura);
    }
    input, select, textarea, button {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1.5px solid var(--cor-borda);
        border-radius: 10px;
        font-size: 1rem;
        box-sizing: border-box;
        font-family: inherit;
        transition: all 0.2s;
        background: #ffffff;
    }
    textarea {
        resize: vertical;
        min-height: 60px;
    }
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--cor-primaria);
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
    }
    button {
        background: linear-gradient(135deg, var(--cor-primaria), var(--cor-secundaria));
        color: white;
        border: none;
        font-weight: 600;
        margin-top: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
    }
    .btn-secondary {
        background: linear-gradient(135deg, #25D366, #1ebe5d);
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
    .btn-tertiary {
        background: linear-gradient(135deg, #6b7280, #4b5563);
        box-shadow: 0 4px 12px rgba(107, 114, 128, 0.3);
    }
    .btn-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex-shrink: 0;
        align-items: stretch;
    }
    .btn-edit,.btn-cancel,.btn-reactivate,.btn-delete,.btn-whats {
        width: 70px;
        padding: 4px 6px;
        font-size: 0.65rem;
        margin-top: 0;
        white-space: nowrap;
        border-radius: 6px;
        font-weight: 500;
        box-shadow: none;
    }
    .btn-edit { background: #3b82f6; }
    .btn-cancel { background: #f59e0b; }
    .btn-reactivate { background: #059669; }
    .btn-delete { background: #dc2626; }
    .btn-whats { background: #25D366; }
    .agendamentos { margin-top: 20px; }
    .agendamento {
        background: #faf5ff;
        border-left: 4px solid var(--cor-primaria);
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        transition: all 0.2s;
    }
    .agendamento:hover {
        background: #f5f3ff;
        transform: translateX(2px);
    }
    .agendamento.cancelado {
        border-left-color: #dc2626;
        opacity: 0.6;
        text-decoration: line-through;
    }
    .info {
        font-size: 0.9rem;
        line-height: 1.4;
        flex: 1 1 auto;
        min-width: 0;
    }
    .info strong {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--cor-primaria-escura);
    }
    .valor {
        font-weight: 700;
        color: var(--cor-secundaria);
        font-size: 1rem;
    }
    .vazio {
        text-align: center;
        color: #6b7280;
        font-style: italic;
        margin-top: 20px;
        padding: 20px;
        background: #faf5ff;
        border-radius: 8px;
        border: 1px dashed var(--cor-borda);
    }
    .alerta {
        background: #fef3c7;
        border-left: 4px solid #f59e0b;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 0.9rem;
    }
    .status {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        color: #dc2626;
        margin-top: 4px;
    }
    .oculto { display: none; }
    .backup-row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
    }
    .backup-row button {
        margin-top: 0;
        font-size: 0.9rem;
    }
    .editando {
        background: #eef2ff;
        border: 2px solid #6366f1;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 16px;
        font-size: 0.9rem;
        color: #4338ca;
    }
    .sinc-status {
        text-align: center;
        font-size: 0.7rem;
        color: #10b981;
        margin-top: 8px;
    }
    .header-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 5px;
    }
    .header-buttons button {
        background: none;
        border: none;
        font-size: 1rem;
        cursor: pointer;
        margin: 0;
        padding: 4px 8px;
        width: auto;
        box-shadow: none;
        color: #6b7280;
    }
    .header-buttons button:hover {
        background: none;
        transform: none;
        color: var(--cor-primaria);
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="estrelas">
            <div class="estrela"></div>
            <div class="estrela"></div>
            <div class="estrela"></div>
            <div class="estrela"></div>
            <div class="estrela"></div>
            <div class="estrela"></div>
        </div>
        <h1>Agenda Rosi Gomes</h1>
        <div class="subtitulo">Podologia e Estética</div>
        <div id="syncStatus" class="sinc-status">🔄 Sincronizando...</div>
        <div class="header-buttons">
            <button id="btnAdmin" title="Modo Administrador">👑</button>
            <button id="btnEsqueci" title="Esqueci a senha">🔑</button>
        </div>
    </div>

    <div id="relatorio" class="relatorio"></div>
    <div id="alertaProximo"></div>

    <div class="tabs">
        <div class="tab active" data-aba="hoje" onclick="trocarAba('hoje')">Hoje</div>
        <div class="tab" data-aba="semana" onclick="trocarAba('semana')">Semana</div>
        <div class="tab" data-aba="todos" onclick="trocarAba('todos')">Todos</div>
    </div>

    <form id="formAgenda">
        <div id="modoEdicao" class="oculto editando"></div>

        <label for="nome"><span class="icon">👤</span> Nome do(a) cliente</label>
        <input type="text" id="nome" placeholder="Digite o nome completo" required>

        <label for="telefone"><span class="icon">📞</span> Telefone</label>
        <input type="tel" id="telefone" placeholder="(11) 99999-9999" inputmode="tel">

        <label for="datahora"><span class="icon">🗓️</span> Data e Horário</label>
        <input type="datetime-local" id="datahora" required>

        <label for="procedimento"><span class="icon">💅</span> Tipo de procedimento</label>
        <select id="procedimento" required onchange="mostrarOutro()">
            <option value="">Selecione...</option>
            <option value="Manicure e Pedicure">Manicure e Pedicure</option>
            <option value="Manicure">Manicure</option>
            <option value="Pedicure">Pedicure</option>
            <option value="Unha de gel">Unha de gel</option>
            <option value="Sobrancelha">Sobrancelha</option>
            <option value="Buço">Buço</option>
            <option value="Depilação">Depilação</option>
            <option value="SPA dos pés">SPA dos pés</option>
            <option value="Outro">Outro</option>
        </select>

        <div id="campoOutro" class="oculto">
            <label for="procedimentoOutro"><span class="icon">✏️</span> Descreva o procedimento</label>
            <input type="text" id="procedimentoOutro" placeholder="Ex: Esmaltação em gel">
        </div>

        <label for="valor"><span class="icon">💰</span> Valor do procedimento R$</label>
        <input type="text" id="valor" placeholder="Ex: 80,00" inputmode="decimal">

        <label for="observacao"><span class="icon">📝</span> Observação</label>
        <textarea id="observacao" placeholder="Ex: Cliente com alergia, retorno em 30 dias..."></textarea>

        <button type="submit" id="btnSalvar">💾 Salvar Agendamento</button>
        <button type="button" class="btn-secondary" onclick="exportarWhatsApp()">⤴️ Compartilhar no WhatsApp</button>

        <div class="backup-row">
            <button type="button" class="btn-tertiary" onclick="exportarBackup()">⬇️ Exportar Backup</button>
            <button type="button" class="btn-tertiary" onclick="document.getElementById('importFile').click()">⬆️ Importar Backup</button>
        </div>
        <input type="file" id="importFile" accept=".json" class="oculto" onchange="importarBackup(event)">
    </form>

    <div class="agendamentos">
        <h2 id="tituloLista" style="font-size:1.1rem; margin-top:0; color: var(--cor-primaria-escura);">Agendamentos de Hoje</h2>
        <div id="lista"></div>
    </div>
</div>
<script>
    // ---------- CONFIGURAÇÃO DO FIREBASE ----------
    const firebaseConfig = {
        apiKey: "AIzaSyCj-lKzxakhUpT8Z4pNIHCi1EjbH4ICQ_Y",
        authDomain: "agenda-rosi.firebaseapp.com",
        databaseURL: "https://agenda-rosi-default-rtdb.firebaseio.com",
        projectId: "agenda-rosi",
        storageBucket: "agenda-rosi.firebasestorage.app",
        messagingSenderId: "66511138621",
        appId: "1:66511138621:web:7d96b3532c3a9b7a30df54"
    };

    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const agendaRef = database.ref('agendamentos');

    // ---------- CONTROLE DE ACESSO À RECEITA ----------
    let isAdmin = false;
    const SENHA_ADMIN = "rosi2025";
    const DICA_SENHA = "Dica: nome + ano";

    // Verifica se já está autenticado (sessionStorage)
    function verificarAdmin() {
        const saved = sessionStorage.getItem('agenda_rosi_admin');
        if (saved === 'true') {
            isAdmin = true;
            document.getElementById('btnAdmin').style.opacity = '1';
        } else {
            isAdmin = false;
            document.getElementById('btnAdmin').style.opacity = '0.5';
        }
        atualizarRelatorio();
    }

    // Login administrativo
    function loginAdmin() {
        const senha = prompt("Digite a senha administrativa para ver a receita:");
        if (senha === SENHA_ADMIN) {
            isAdmin = true;
            sessionStorage.setItem('agenda_rosi_admin', 'true');
            document.getElementById('btnAdmin').style.opacity = '1';
            alert("✅ Modo administrador ativado. Agora você vê a receita.");
            atualizarRelatorio();
        } else if (senha !== null) {
            alert("❌ Senha incorreta. A receita permanecerá oculta.");
        }
    }

    // Recuperação de senha com dica (sem exibir a senha)
    function recuperarSenha() {
        alert(`🔐 Dica de senha\n\n${DICA_SENHA}\n\nExemplo: xxxxxxxx`);
    }

    // Associar eventos dos botões
    document.getElementById('btnAdmin').addEventListener('click', loginAdmin);
    document.getElementById('btnEsqueci').addEventListener('click', recuperarSenha);

    // ---------- VARIÁVEIS GLOBAIS ----------
    let abaAtual = 'hoje';
    let timers = [];
    let mostrarReceita = true;
    let idEditando = null;
    let todosAgendamentos = [];

    // Elementos DOM
    const form = document.getElementById('formAgenda');
    const lista = document.getElementById('lista');
    const alertaProximo = document.getElementById('alertaProximo');
    const tituloLista = document.getElementById('tituloLista');
    const relatorio = document.getElementById('relatorio');
    const campoOutro = document.getElementById('campoOutro');
    const modoEdicao = document.getElementById('modoEdicao');
    const btnSalvar = document.getElementById('btnSalvar');
    const syncStatus = document.getElementById('syncStatus');

    // ---------- UTILITÁRIOS ----------
    function setMinDateTime() {
        const agora = new Date();
        const ano = agora.getFullYear();
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const dia = String(agora.getDate()).padStart(2, '0');
        const hora = String(agora.getHours()).padStart(2, '0');
        const min = String(agora.getMinutes()).padStart(2, '0');
        document.getElementById('datahora').min = `${ano}-${mes}-${dia}T${hora}:${min}`;
    }
    setMinDateTime();

    document.getElementById('telefone').addEventListener('input', e => {
        let v = e.target.value.replace(/\D/g,'').slice(0,11);
        v = v.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
        e.target.value = v;
    });

    document.getElementById('valor').addEventListener('input', e => {
        let v = e.target.value.replace(/\D/g,'');
        if (!v) { e.target.value = ''; return; }
        v = (parseInt(v, 10) / 100).toFixed(2);
        e.target.value = v.replace('.', ',');
    });

    function mostrarOutro() {
        const proc = document.getElementById('procedimento').value;
        if (proc === 'Outro') {
            campoOutro.classList.remove('oculto');
            document.getElementById('procedimentoOutro').required = true;
        } else {
            campoOutro.classList.add('oculto');
            document.getElementById('procedimentoOutro').required = false;
        }
    }

    function formatarMoeda(valor) {
        const num = parseFloat(valor) || 0;
        return num.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
    }

    function limparValor(valorStr) {
        if (!valorStr) return 0;
        return parseFloat(valorStr.replace(',', '.')) || 0;
    }

    function toggleReceita() {
        mostrarReceita = !mostrarReceita;
        atualizarRelatorio();
    }

    function atualizarRelatorio() {
        const agora = new Date();
        const mesAtual = agora.getMonth();
        const anoAtual = agora.getFullYear();
        const doMes = todosAgendamentos.filter(item => {
            const dt = new Date(item.datahora);
            return dt.getMonth() === mesAtual && dt.getFullYear() === anoAtual;
        });
        const confirmados = doMes.filter(i => !i.cancelado);
        const cancelados = doMes.filter(i => i.cancelado);
        const receita = confirmados.reduce((soma, item) => soma + limparValor(item.valor), 0);
        
        // Só exibe valor se for admin E se mostrarReceita for true
        const valorExibido = (mostrarReceita && isAdmin) ? formatarMoeda(receita) : 'R$ ••••';
        
        relatorio.innerHTML = `
            <div class="relatorio-item">
                <div class="relatorio-num">${confirmados.length}</div>
                <div class="relatorio-label">Confirmados</div>
            </div>
            <div class="relatorio-item">
                <div class="relatorio-num" style="color:#dc2626">${cancelados.length}</div>
                <div class="relatorio-label">Cancelados</div>
            </div>
            <div class="relatorio-receita" onclick="toggleReceita()">
                <div class="relatorio-num">${valorExibido}</div>
                <div class="relatorio-label">Receita do Mês - toque para ${mostrarReceita ? 'ocultar' : 'exibir'}</div>
            </div>
        `;
    }

    function trocarAba(aba) {
        abaAtual = aba;
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.remove('active');
            if (t.dataset.aba === aba) t.classList.add('active');
        });
        const titulos = { hoje: 'Agendamentos de Hoje', semana: 'Agendamentos da Semana', todos: 'Todos os Agendamentos' };
        tituloLista.textContent = titulos[aba];
        renderizarLista();
    }

    function renderizarLista() {
        if (!todosAgendamentos.length) {
            lista.innerHTML = `<div class="vazio">Carregando agendamentos...</div>`;
            return;
        }
        const agora = new Date();
        const hojeStr = agora.toISOString().split('T')[0];
        const inicioSemana = new Date(agora);
        inicioSemana.setDate(agora.getDate() - agora.getDay());
        const fimSemana = new Date(inicioSemana);
        fimSemana.setDate(inicioSemana.getDate() + 6);
        let dadosFiltrados = [...todosAgendamentos];
        dadosFiltrados.sort((a,b) => new Date(a.datahora) - new Date(b.datahora));
        if (abaAtual === 'hoje') {
            dadosFiltrados = dadosFiltrados.filter(item => new Date(item.datahora).toISOString().split('T')[0] === hojeStr);
        } else if (abaAtual === 'semana') {
            dadosFiltrados = dadosFiltrados.filter(item => {
                const dt = new Date(item.datahora);
                return dt >= inicioSemana && dt <= fimSemana;
            });
        }
        lista.innerHTML = '';
        timers.forEach(t => clearTimeout(t));
        timers = [];
        alertaProximo.innerHTML = '';
        if (dadosFiltrados.length === 0) {
            lista.innerHTML = `<div class="vazio">Sem agendamentos ${abaAtual === 'hoje' ? 'para hoje' : abaAtual === 'semana' ? 'nesta semana' : ''}</div>`;
            return;
        }
        let proximo = null;
        dadosFiltrados.forEach((item) => {
            const dt = new Date(item.datahora);
            const dataFormatada = dt.toLocaleString('pt-BR', {dateStyle: abaAtual === 'hoje' ? 'short' : 'medium', timeStyle: 'short'});
            const valorNum = limparValor(item.valor);
            if (abaAtual === 'hoje' && !proximo && dt > agora && !item.cancelado) {
                proximo = item;
                const diffMin = Math.round((dt - agora) / 60000);
                if (diffMin <= 60 && diffMin > 0) {
                    alertaProximo.innerHTML = `<div class="alerta">⏰ Próximo: ${item.nome} em ${diffMin} min - ${item.procedimento}</div>`;
                }
            }
            if (abaAtual === 'hoje' && !item.cancelado) {
                const tempoAteAviso = dt.getTime() - agora.getTime() - 30 * 60 * 1000;
                if (tempoAteAviso > 0) {
                    const timer = setTimeout(() => {
                        if (Notification.permission === "granted") {
                            new Notification("Agenda Rosi Gomes", { body: `${item.nome} - ${item.procedimento} em 30 minutos` });
                        } else {
                            alert(`Lembrete: ${item.nome} em 30 min`);
                        }
                    }, tempoAteAviso);
                    timers.push(timer);
                }
            }
            lista.innerHTML += `
                <div class="agendamento ${item.cancelado ? 'cancelado' : ''}">
                    <div class="info">
                        <strong>${item.nome}</strong>
                        ${dataFormatada} - ${item.procedimento}<br>
                        ${valorNum > 0 ? `<span class="valor">${formatarMoeda(valorNum)}</span><br>` : ''}
                        ${item.telefone ? '📞 ' + item.telefone + '<br>' : ''}
                        ${item.observacao ? '📝 ' + item.observacao : ''}
                        ${item.cancelado ? '<div class="status">Cancelado</div>' : ''}
                    </div>
                    <div class="btn-row">
                        ${!item.cancelado && item.telefone ? `<button class="btn-whats" onclick="confirmarWhats('${item.id}')">Confirmar</button>` : ''}
                        ${!item.cancelado ? `<button class="btn-edit" onclick="editar('${item.id}')">Editar</button>` : ''}
                        ${item.cancelado ? `<button class="btn-reactivate" onclick="reativar('${item.id}')">Reativar</button>` : `<button class="btn-cancel" onclick="cancelar('${item.id}')">Cancelar</button>`}
                        <button class="btn-delete" onclick="deletar('${item.id}')">Excluir</button>
                    </div>
                </div>
            `;
        });
        if (abaAtual === 'hoje') {
            lista.innerHTML += `<div class="total-dia">Total de agendamentos hoje: ${dadosFiltrados.length}</div>`;
        }
    }

    // ---------- FIREBASE OPERATIONS ----------
    function carregarDoFirebase() {
        agendaRef.on('value', (snapshot) => {
            const dados = snapshot.val();
            if (dados) {
                todosAgendamentos = Object.entries(dados).map(([key, value]) => ({ id: key, ...value }));
                syncStatus.textContent = '✅ Sincronizado em tempo real';
                syncStatus.style.color = '#10b981';
            } else {
                todosAgendamentos = [];
                syncStatus.textContent = '📭 Nenhum agendamento ainda';
            }
            atualizarRelatorio();
            renderizarLista();
        }, (error) => {
            console.error(error);
            syncStatus.textContent = '⚠️ Erro de conexão';
            syncStatus.style.color = '#dc2626';
        });
    }

    function salvarNoFirebase(novoAgendamento, idExistente = null) {
        if (idExistente) return agendaRef.child(idExistente).update(novoAgendamento);
        else return agendaRef.push(novoAgendamento);
    }

    function removerDoFirebase(id) {
        return agendaRef.child(id).remove();
    }

    function editar(id) {
        const item = todosAgendamentos.find(d => d.id === id);
        if (!item) return;
        idEditando = id;
        document.getElementById('datahora').removeAttribute('min');
        document.getElementById('nome').value = item.nome;
        document.getElementById('telefone').value = item.telefone;
        document.getElementById('datahora').value = item.datahora;
        document.getElementById('valor').value = item.valor;
        document.getElementById('observacao').value = item.observacao;
        const procedimentos = ['Manicure e Pedicure','Manicure','Pedicure','Unha de gel','Sobrancelha','Buço','Depilação','SPA dos pés'];
        if (procedimentos.includes(item.procedimento)) {
            document.getElementById('procedimento').value = item.procedimento;
            campoOutro.classList.add('oculto');
        } else {
            document.getElementById('procedimento').value = 'Outro';
            campoOutro.classList.remove('oculto');
            document.getElementById('procedimentoOutro').value = item.procedimento;
        }
        modoEdicao.classList.remove('oculto');
        modoEdicao.innerHTML = `✏️ Editando: <strong>${item.nome}</strong> - ${new Date(item.datahora).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'})}`;
        btnSalvar.innerHTML = '💾 Atualizar Agendamento';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function cancelarEdicao() {
        idEditando = null;
        form.reset();
        campoOutro.classList.add('oculto');
        modoEdicao.classList.add('oculto');
        btnSalvar.innerHTML = '💾 Salvar Agendamento';
        setMinDateTime();
    }

    function cancelar(id) {
        if (!confirm('Cancelar este agendamento?')) return;
        salvarNoFirebase({ cancelado: true }, id);
    }

    function reativar(id) {
        salvarNoFirebase({ cancelado: false }, id);
    }

    function deletar(id) {
        if (!confirm('Tem certeza que deseja excluir permanentemente?')) return;
        removerDoFirebase(id);
    }

    function confirmarWhats(id) {
        const item = todosAgendamentos.find(d => d.id === id);
        if (!item || !item.telefone) return;
        const dt = new Date(item.datahora);
        const dataFormatada = dt.toLocaleString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long', hour: '2-digit', minute: '2-digit'});
        const valorNum = limparValor(item.valor);
        let texto = `Olá, ${item.nome}! ✨ Aqui é a Rosi Gomes.\n\nPassando para confirmar seu agendamento:\n\n📅 ${dataFormatada}\n💅 ${item.procedimento}`;
        if(valorNum > 0) texto += `\n💰 ${formatarMoeda(valorNum)}`;
        texto += `\n\nPosso confirmar? Aguardo você 💜`;
        const telefone = item.telefone.replace(/\D/g,'');
        window.open(`https://wa.me/55${telefone}?text=${encodeURIComponent(texto)}`, '_blank');
    }

    function exportarWhatsApp() {
        let dadosExportar = [...todosAgendamentos];
        if (abaAtual === 'hoje') {
            const hoje = new Date().toISOString().split('T')[0];
            dadosExportar = dadosExportar.filter(item => new Date(item.datahora).toISOString().split('T')[0] === hoje);
        } else if (abaAtual === 'semana') {
            const agora = new Date();
            const inicioSemana = new Date(agora);
            inicioSemana.setDate(agora.getDate() - agora.getDay());
            const fimSemana = new Date(inicioSemana);
            fimSemana.setDate(inicioSemana.getDate() + 6);
            dadosExportar = dadosExportar.filter(item => {
                const dt = new Date(item.datahora);
                return dt >= inicioSemana && dt <= fimSemana;
            });
        }
        if(dadosExportar.length === 0) { alert('Não há agendamentos para exportar'); return; }
        let texto = `*Agenda Rosi Gomes - Podóloga*\n*${abaAtual.toUpperCase()}*\n\n`;
        let totalValor = 0;
        dadosExportar.forEach(item => {
            const dt = new Date(item.datahora);
            const dataFormatada = dt.toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
            const valorNum = limparValor(item.valor);
            if (!item.cancelado) totalValor += valorNum;
            texto += `${item.cancelado ? '[CANCELADO] ' : ''}*${item.nome}* - ${dataFormatada}\n${item.procedimento}`;
            if(valorNum > 0) texto += ` - ${formatarMoeda(valorNum)}`;
            texto += '\n';
            if(item.telefone) texto += `Telefone: ${item.telefone}\n`;
            if(item.observacao) texto += `Obs: ${item.observacao}\n`;
            texto += '\n';
        });
        // Só inclui total de receita se for admin
        if (abaAtual !== 'todos' && isAdmin) {
            texto += `*Total Receita: ${formatarMoeda(totalValor)}*`;
        }
        location.href = 'https://wa.me/?text=' + encodeURIComponent(texto);
    }

    function exportarBackup() {
        const dadosStr = JSON.stringify(todosAgendamentos, null, 2);
        const blob = new Blob([dadosStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'agenda-rosi-backup.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function importarBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const dados = JSON.parse(e.target.result);
                if (!Array.isArray(dados)) throw new Error('Arquivo inválido');
                if (confirm('Isso vai substituir TODOS os agendamentos no servidor. Continuar?')) {
                    agendaRef.remove().then(() => {
                        const promises = dados.map(item => {
                            const { id, ...semId } = item;
                            return agendaRef.push(semId);
                        });
                        Promise.all(promises).then(() => alert('Backup importado com sucesso!'));
                    });
                }
            } catch(err) { alert('Erro ao ler arquivo: ' + err.message); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const procSelect = document.getElementById('procedimento').value;
        const procOutro = document.getElementById('procedimentoOutro').value.trim();
        const procedimentoFinal = procSelect === 'Outro' ? procOutro : procSelect;
        if (!procedimentoFinal) { alert('Descreva o procedimento para "Outro"'); return; }
        const dataHoraNova = document.getElementById('datahora').value;
        const conflito = todosAgendamentos.some(d => d.datahora === dataHoraNova && !d.cancelado && d.id !== idEditando);
        if (conflito) { alert('Já existe um agendamento ativo nesse horário'); return; }
        const agendamentoData = {
            nome: document.getElementById('nome').value.trim(),
            telefone: document.getElementById('telefone').value.trim(),
            datahora: dataHoraNova,
            procedimento: procedimentoFinal,
            valor: document.getElementById('valor').value,
            observacao: document.getElementById('observacao').value.trim(),
            cancelado: false
        };
        if (idEditando) {
            salvarNoFirebase(agendamentoData, idEditando).then(() => { cancelarEdicao(); form.reset(); setMinDateTime(); });
        } else {
            salvarNoFirebase(agendamentoData).then(() => { form.reset(); campoOutro.classList.add('oculto'); setMinDateTime(); });
        }
    });

    if ("Notification" in window) Notification.requestPermission();
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW falhou', err));
        });
    }
    carregarDoFirebase();
    verificarAdmin();
    setInterval(() => renderizarLista(), 60000);
</script>
</body>
